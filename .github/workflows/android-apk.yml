name: Build Hye Arcade APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

env:
  NODE_VERSION: 22
  JAVA_VERSION: 21

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Install web dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Ensure Capacitor Android platform exists
        run: if [ ! -d android ]; then npx cap add android; fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Prepare Android LAN/cleartext configuration
        run: node scripts/prepare-android.mjs

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
        if: ${{ hashFiles('android/gradle/wrapper/gradle-wrapper.jar') != '' }}

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/HyeArcade.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hye-arcade-debug-apk
          path: android/app/build/outputs/apk/debug/HyeArcade.apk
          if-no-files-found: error

      - name: Publish tagged APK release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/HyeArcade.apk
          generate_release_notes: true
